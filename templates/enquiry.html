{% extends "base.html" %} {% block title %} Enquiry · Adelaide Artisan Bakery {%
endblock %} {% block content %}

<section class="form-section">
  <div class="form-card">
    <p class="eyebrow">GET IN TOUCH</p>

    <h1>Send an enquiry</h1>

    <p class="muted">
      Ask about custom cakes, larger orders, product availability or anything
      else.
    </p>

    <form method="post">
      <div class="field">
        <label for="name">
          Name
          <span aria-hidden="true">*</span>
        </label>

        <input
          id="name"
          name="name"
          type="text"
          maxlength="120"
          required
          autocomplete="name"
          value="{{ values.name if values else '' }}"
        />
      </div>

      <div class="field">
        <label for="email">
          Email
          <span aria-hidden="true">*</span>
        </label>

        <input
          id="email"
          name="email"
          type="email"
          maxlength="255"
          required
          autocomplete="email"
          value="{{ values.email if values else '' }}"
        />
      </div>

      <div class="field">
        <label for="message">
          Message
          <span aria-hidden="true">*</span>
        </label>

        <textarea
          id="message"
          name="message"
          minlength="10"
          maxlength="2000"
          required
        >
{{ values.message if values else '' }}</textarea
        >
      </div>

      <button type="submit" class="button">Send enquiry</button>
    </form>
  </div>
</section>

{% endblock %}
