{% extends "base.html" %} {% block title %} {{ action }} Product · Adelaide
Artisan Bakery {% endblock %} {% block content %}

<section class="form-section">
  <div class="form-card">
    <p class="eyebrow">PRODUCT CATALOGUE</p>

    <h1>{{ action }} product</h1>

    <p class="muted">
      Enter the product information below. Required fields are marked with an
      asterisk.
    </p>

    <form method="post">
      <div class="field">
        <label for="name">
          Product name
          <span aria-hidden="true">*</span>
        </label>

        <input
          id="name"
          name="name"
          type="text"
          maxlength="120"
          required
          autocomplete="off"
          value="{{ product.name if product else '' }}"
        />
      </div>

      <div class="field">
        <label for="category">
          Category
          <span aria-hidden="true">*</span>
        </label>

        <select id="category" name="category" required>
          <option value="">Select a category</option>

          {% for category in [ "Bread", "Pastry", "Cake", "Savoury", "Other" ]
          %}

          <option
            value="{{ category }}"
            {%
            if
            product
            and
            product.category=""
            ="category"
            %}
            selected
            {%
            endif
            %}
          >
            {{ category }}
          </option>

          {% endfor %}
        </select>
      </div>

      <div class="field">
        <label for="description">
          Description
          <span aria-hidden="true">*</span>
        </label>

        <textarea id="description" name="description" maxlength="2000" required>
{{ product.description if product else '' }}</textarea
        >
      </div>

      <div class="field">
        <label for="price">
          Price in AUD
          <span aria-hidden="true">*</span>
        </label>

        <input
          id="price"
          name="price"
          type="number"
          min="0"
          step="0.01"
          required
          value="{{ product.price if product else '' }}"
        />
      </div>

      <div class="checkbox-field">
        <input
          id="available"
          name="available"
          type="checkbox"
          {%
          if
          not
          product
          or
          product.available
          %}
          checked
          {%
          endif
          %}
        />

        <label for="available"> Product is currently available </label>
      </div>

      <div class="form-actions">
        <a href="/products" class="button secondary"> Cancel </a>

        <button type="submit" class="button">{{ action }} product</button>
      </div>
    </form>
  </div>
</section>

{% endblock %}
